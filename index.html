<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>EJ Binary Subset Prime Oracle</title>
<meta name="description" content="Test primality using Elizabeth Johnson's 3 Core Asks of the Binary Layer of the Subset System and Mod-9 Counterflow — zero factorization.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000000'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%2339ff14' font-family='monospace'%3E3Q%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --card-bg: #050a05;
    --border: #0d3b0c;
    --green: #39ff14;
    --green-dim: #22b80d;
    --green-faint: #0d4a05;
    --green-ghost: #031a01;
    --glow: rgba(57, 255, 20, 0.45);
    --warn: #ffab40;
    --comp: #ff5252;
    --mono: "Share Tech Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--green);
    font-family: var(--mono);
    line-height: 1.5;
    min-height: 100vh;
    padding: 16px 12px 48px;
  }

  .container {
    max-width: 740px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
    padding-top: 12px;
  }

  .badge {
    display: inline-block;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--green);
    background: var(--green-ghost);
    border: 1px solid var(--green-faint);
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 10px;
    text-shadow: 0 0 6px var(--glow);
  }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    text-shadow: 0 0 12px var(--glow), 0 0 24px rgba(57,255,20,0.2);
  }

  .subtitle {
    margin: 0 auto;
    max-width: 54ch;
    color: var(--green-dim);
    font-size: clamp(0.85rem, 3.2vw, 0.95rem);
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
  }

  .input-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  input[type="text"] {
    flex: 1 1 200px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    color: var(--green);
    outline: none;
    caret-color: var(--green);
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input[type="text"]:focus {
    border-color: var(--green);
    box-shadow: 0 0 12px var(--glow);
  }

  input[type="text"]::placeholder {
    color: var(--green-faint);
  }

  button {
    font-family: var(--mono);
    font-weight: 400;
    font-size: 0.95rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    padding: 11px 16px;
    cursor: pointer;
    background: transparent;
    color: var(--green);
    transition: background 0.12s, color 0.12s, box-shadow 0.12s, border-color 0.12s;
    touch-action: manipulation;
  }

  button:active { transform: translateY(1px); }

  button.primary {
    background: var(--green);
    color: #000000;
    border-color: var(--green);
    box-shadow: 0 0 10px var(--glow);
    font-weight: 700;
  }

  button.primary:hover {
    box-shadow: 0 0 20px var(--glow);
    filter: brightness(1.1);
  }

  button.secondary {
    background: var(--green-ghost);
    border-color: var(--green-faint);
    color: var(--green-dim);
  }

  button.secondary:hover {
    border-color: var(--green);
    color: var(--green);
  }

  .presets {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    font-size: 0.85rem;
    color: var(--green-dim);
  }

  .chip {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 4px 8px;
    border-radius: 4px;
    background: var(--bg);
    color: var(--green-dim);
    border: 1px solid var(--green-faint);
  }

  .chip:hover {
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 8px var(--glow);
  }

  /* Big Header Badge */
  .big-status-banner {
    text-align: center;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .big-status-banner.is-prime {
    background: var(--green-ghost);
    color: var(--green);
    border: 2px solid var(--green);
    text-shadow: 0 0 16px var(--glow);
  }
  .big-status-banner.is-comp {
    background: rgba(255, 82, 82, 0.08);
    color: var(--comp);
    border: 2px solid var(--comp);
    text-shadow: 0 0 16px rgba(255, 82, 82, 0.5);
  }

  /* Verdict Box */
  .verdict-box {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--green-ghost);
    margin-bottom: 16px;
  }

  .verdict-box.is-prime { border-color: var(--green); }
  .verdict-box.is-comp { border-color: var(--comp); background: rgba(255, 82, 82, 0.05); }

  .verdict-title {
    font-size: clamp(1rem, 3.5vw, 1.25rem);
    font-weight: 700;
    margin: 0;
  }

  .is-prime .verdict-title { color: var(--green); }
  .is-comp .verdict-title { color: var(--comp); }

  .verdict-sub {
    color: var(--green-dim);
    font-size: 0.82rem;
    margin-top: 4px;
  }

  .score-pill {
    text-align: right;
  }

  .score-pill .num {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 8px var(--glow);
  }

  .score-pill .lbl {
    font-size: 0.7rem;
    color: var(--green-dim);
    text-transform: uppercase;
  }

  /* 3 Asks Section */
  h2 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--green-dim);
    margin: 18px 0 8px;
    border-bottom: 1px solid var(--green-faint);
    padding-bottom: 4px;
  }

  .ask-card {
    background: var(--bg);
    border: 1px solid var(--green-faint);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .ask-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .ask-title {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--green);
  }

  .ask-status {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
  }

  .status-pass { background: var(--green-ghost); color: var(--green); border: 1px solid var(--green-dim); text-shadow: 0 0 6px var(--glow); }
  .status-fail { background: rgba(255,82,82,0.1); color: var(--comp); border: 1px solid rgba(255,82,82,0.3); }

  .ask-body {
    font-size: 0.85rem;
    color: var(--green-dim);
    word-break: break-word;
  }

  /* 30-Block Byte Strip */
  .byte-wrap {
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .byte-strip {
    display: grid;
    grid-template-columns: repeat(8, minmax(36px, 1fr));
    gap: 4px;
    margin-top: 8px;
    min-width: 320px;
  }

  .slot-cell {
    background: var(--bg);
    border: 1px solid var(--green-faint);
    border-radius: 4px;
    padding: 6px 2px;
    text-align: center;
  }

  .slot-cell.active {
    border-color: var(--green);
    background: var(--green-ghost);
    box-shadow: 0 0 10px var(--glow);
  }

  .slot-cell .res { font-size: 0.65rem; color: var(--green-dim); }
  .slot-cell .bit-val { font-size: 0.95rem; font-weight: 700; margin: 2px 0; color: var(--green-faint); }
  .slot-cell.active .bit-val, .slot-cell .bit-val.lit { color: var(--green); text-shadow: 0 0 6px var(--glow); }
  .slot-cell .cand { font-size: 0.6rem; color: var(--green-dim); }

  .rf-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--green-faint);
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 0.82rem;
  }

  .rf-bit {
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 700;
  }
  .rf-0 { background: var(--green-ghost); color: var(--green); border: 1px solid var(--green-faint); }
  .rf-1 { background: rgba(255,171,64,0.1); color: var(--warn); border: 1px solid rgba(255,171,64,0.3); }

  .share-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--green-faint);
  }

  .error-msg {
    color: var(--comp);
    padding: 10px;
    background: rgba(255,82,82,0.1);
    border: 1px solid rgba(255,82,82,0.3);
    border-radius: 6px;
    font-size: 0.9rem;
  }

  footer {
    text-align: center;
    color: var(--green-dim);
    font-size: 0.78rem;
    margin-top: 24px;
    border-top: 1px solid var(--green-faint);
    padding-top: 12px;
  }

  @media (max-width: 480px) {
    body { padding: 8px 6px 32px; }
    .card { padding: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">Matrix Binary Layer · 3 Core Asks</div>
    <h1>Prime Oracle</h1>
    <p class="subtitle">
      Zero factorization primality testing via Elizabeth Johnson’s Binary Subset System and Mod-9 Counterflow.
    </p>
  </header>

  <section class="card">
    <div class="input-row">
      <input type="text" id="numInput" inputmode="numeric" placeholder="Enter integer..." autocomplete="off" autofocus>
      <button class="primary" id="checkBtn" type="button">Check</button>
      <button class="secondary" id="randBtn" type="button">Random</button>
    </div>
    <div class="presets">
      <span>Try:</span>
      <button class="chip" type="button" data-val="102197">102197</button>
      <button class="chip" type="button" data-val="102199">102199</button>
      <button class="chip" type="button" data-val="999983">999983</button>
      <button class="chip" type="button" data-val="561">561</button>
      <button class="chip" type="button" data-val="1000003">1000003</button>
    </div>
  </section>

  <section id="output" class="card" aria-live="polite"></section>

  <footer>
    Built on Elizabeth Johnson’s Alternate Base Prime Number Pattern &amp; Twin Prime Counterflow Model · Pure Browser JS
  </footer>
</div>

<script>
(function () {
  "use strict";

  const END_DIGIT_BITS = { 1: "00", 3: "01", 7: "10", 9: "11" };
  const RESIDUES_MOD30 = [1, 7, 11, 13, 17, 19, 23, 29];
  const ADMISSIBLE_MOD9 = [1, 2, 4, 5, 7, 8];
  const TWIN_CLASS_LOW = { 2: "(2, 4)", 5: "(5, 7)", 8: "(8, 1)" };
  const TWIN_CLASS_HIGH = { 4: "(2, 4)", 7: "(5, 7)", 1: "(8, 1)" };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
    }[c]));
  }

  function evaluateThreeAsks(nBig) {
    if (nBig < 2n) {
      return { isCandidate: false, verdict: "NOT PRIME", score: 0.01, asks: [] };
    }

    if (nBig === 2n || nBig === 3n || nBig === 5n) {
      return {
        isCandidate: true,
        verdict: "AXIOMATIC BASE PRIME",
        score: 0.99,
        asks: [
          { title: "Ask 1 · Binary Form", pass: true, detail: `${nBig} is an axiomatic generator prime.` },
          { title: "Ask 2 · 30-Block Byte", pass: true, detail: `Base generator slot.` },
          { title: "Ask 3 · Rise/Fall & Mod-9", pass: true, detail: `Core base prime flow.` }
        ]
      };
    }

    const digit = Number(nBig % 10n);
    const mod30 = Number(nBig % 30n);
    const mod9 = Number(nBig % 9n);
    const counter = nBig / 10n;
    const block = nBig / 30n;
    const slot = RESIDUES_MOD30.indexOf(mod30);
    const bits = END_DIGIT_BITS[digit] || null;
    const mod9Adm = ADMISSIBLE_MOD9.includes(mod9);

    const ask1Pass = bits !== null;
    const ask1Detail = ask1Pass
      ? `Binary form: 10×${counter} + ${digit} (2-bit end key: ${bits})`
      : `End digit ${digit} is forbidden (must be 1, 3, 7, or 9).`;

    const ask2Pass = slot !== -1;
    const blockStart = block * 30n;
    const ask2Detail = ask2Pass
      ? `Residue ${mod30} occupies Slot ${slot}/7 in 30-block #${block}.`
      : `Residue ${mod30} is not coprime to 30.`;

    const ask3Pass = mod9Adm;
    let twinNote = "Admissible flow";
    if (TWIN_CLASS_LOW[mod9]) twinNote = `Lower twin ${TWIN_CLASS_LOW[mod9]}`;
    if (TWIN_CLASS_HIGH[mod9]) twinNote = `Upper twin ${TWIN_CLASS_HIGH[mod9]}`;
    const ask3Detail = ask3Pass
      ? `Mod-9 indicator ${(mod9 / 9).toFixed(9)} · ${twinNote}`
      : `Mod-9 indicator ${(mod9 / 9).toFixed(9)} — divisible by 3.`;

    let sub = 0.32;
    if (!ask1Pass) sub = 0.02;
    else if (!ask2Pass) sub = 0.03;
    else {
      const m6 = Number(nBig % 6n);
      sub += (m6 === 1 || m6 === 5) ? 0.20 : -0.32;
      sub += 0.05;
      const slotBonus = [0.03, 0.06, 0.09, 0.09, 0.08, 0.07, 0.05, 0.04];
      sub += slotBonus[slot];
      sub += (nBig % 7n !== 0n) ? 0.06 : -0.28;
      sub += (nBig % 11n !== 0n) ? 0.04 : -0.20;
      sub += (nBig % 13n !== 0n) ? 0.03 : -0.16;
      if (counter % 10n !== 0n) sub += 0.02;
      if (mod9Adm) sub += 0.03;
      sub = Math.max(0.04, Math.min(0.94, sub));
    }

    let m9Score = mod9Adm ? 0.50 : 0.12;
    if (TWIN_CLASS_LOW[mod9] || TWIN_CLASS_HIGH[mod9]) m9Score += 0.15;
    m9Score = Math.max(0.05, Math.min(0.92, m9Score));

    const blended = 0.60 * sub + 0.40 * m9Score;
    const allPass = ask1Pass && ask2Pass && ask3Pass;
    const isCandidate = allPass && blended >= 0.60;

    let verdict = allPass ? (isCandidate ? "SUBSET PRIME CANDIDATE" : "LIKELY COMPOSITE") : "COMPOSITE (REJECTED)";

    const blockSlots = RESIDUES_MOD30.map((res, idx) => {
      const cand = blockStart + BigInt(res);
      const cDigit = Number(cand % 10n);
      const cMod9 = Number(cand % 9n);
      const open = ADMISSIBLE_MOD9.includes(cMod9);
      return { idx, res, cand, digit: cDigit, open, isTarget: idx === slot };
    });

    const openDigits = blockSlots.filter(s => s.open).map(s => s.digit);
    const rfBits = [];
    for (let i = 0; i < openDigits.length - 1; i++) {
      rfBits.push(openDigits[i + 1] > openDigits[i] ? "0" : "1");
    }

    return {
      isCandidate,
      verdict,
      score: blended,
      asks: [
        { title: "Ask 1 · Binary Form & Key", pass: ask1Pass, detail: ask1Detail },
        { title: "Ask 2 · 30-Block Slot", pass: ask2Pass, detail: ask2Detail },
        { title: "Ask 3 · Rise/Fall & Mod-9", pass: ask3Pass, detail: ask3Detail }
      ],
      blockSlots,
      openDigits,
      rfBits
    };
  }

  function render(rawInput) {
    const out = document.getElementById("output");
    const cleaned = String(rawInput).replace(/[\s,_]/g, "");

    if (!cleaned || !/^\d+$/.test(cleaned)) {
      out.innerHTML = `<div class="error-msg">Enter a valid non-negative integer.</div>`;
      return;
    }

    const nBig = BigInt(cleaned);
    const r = evaluateThreeAsks(nBig);

    try {
      const url = new URL(window.location.href);
      url.searchParams.set("n", cleaned);
      window.history.replaceState({}, "", url);
    } catch (_) {}

    const boxClass = r.isCandidate ? "is-prime" : "is-comp";
    const statusLabel = r.isCandidate ? "PRIME" : "NOT PRIME";

    let html = `
      <div class="big-status-banner ${boxClass}">
        ${statusLabel}
      </div>
      <div class="verdict-box ${boxClass}">
        <div>
          <div class="verdict-title">${escapeHtml(r.verdict)}</div>
          <div class="verdict-sub">Evaluated via 3 Core Asks (Zero Factorization).</div>
        </div>
        <div class="score-pill">
          <div class="num">${r.score.toFixed(3)}</div>
          <div class="lbl">Score</div>
        </div>
      </div>

      <h2>The 3 Core Asks</h2>
    `;

    r.asks.forEach((ask, idx) => {
      html += `
        <div class="ask-card">
          <div class="ask-header">
            <span class="ask-title">Ask ${idx + 1}: ${escapeHtml(ask.title.split("·")[1].trim())}</span>
            <span class="ask-status ${ask.pass ? "status-pass" : "status-fail"}">${ask.pass ? "PASS [1]" : "FAIL [0]"}</span>
          </div>
          <div class="ask-body">${escapeHtml(ask.detail)}</div>
        </div>
      `;
    });

    if (nBig >= 6n) {
      html += `
        <h2>30-Block Subset Byte Map</h2>
        <div class="byte-wrap">
          <div class="byte-strip">
            ${r.blockSlots.map(s => `
              <div class="slot-cell ${s.isTarget ? "active" : ""}" title="${s.cand}">
                <div class="res">+${s.res}</div>
                <div class="bit-val ${s.open ? "lit" : ""}">${s.open ? "1" : "0"}</div>
                <div class="cand">${s.digit}</div>
              </div>
            `).join("")}
          </div>
        </div>

        <h2>Rise / Fall Skeleton</h2>
        <div class="rf-row">
          <span style="color: var(--green-dim); font-size: 0.78rem;">Digits [${r.openDigits.join(" → ")}]:</span>
          ${r.rfBits.map(b => `<span class="rf-bit rf-${b}">${b} (${b === "0" ? "rise" : "fall"})</span>`).join("")}
        </div>
      `;
    }

    const shareText = encodeURIComponent(`Tested ${cleaned} in EJ's 3-Ask Subset Binary Prime Oracle:\n• Result: ${statusLabel}\n• Verdict: ${r.verdict}\n• Score: ${r.score.toFixed(3)}\n`);
    const shareUrl = encodeURIComponent(window.location.href);

    html += `
      <div class="share-bar">
        <span style="color: var(--green-dim); font-size: 0.8rem;">Share test on X:</span>
        <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;">
          <button class="secondary" type="button">Post on X</button>
        </a>
      </div>
    `;

    out.innerHTML = html;
  }

  const input = document.getElementById("numInput");
  document.getElementById("checkBtn").addEventListener("click", () => render(input.value));
  input.addEventListener("keydown", e => { if (e.key === "Enter") render(input.value); });

  document.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      input.value = btn.dataset.val;
      render(input.value);
    });
  });

  document.getElementById("randBtn").addEventListener("click", () => {
    const ends = [1, 3, 7, 9];
    const base = Math.floor(1000 + Math.random() * 999000);
    const d = ends[Math.floor(Math.random() * ends.length)];
    const val = `${base}${d}`;
    input.value = val;
    render(val);
  });

  const params = new URLSearchParams(window.location.search);
  const initial = params.get("n") || "102197";
  input.value = initial;
  render(initial);
})();
</script>
</body>
</html>
